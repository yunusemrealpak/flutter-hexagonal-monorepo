# ---------------------------------------------------------------------------
# Git hooks.
#
# Install once per clone:
#   brew install lefthook   # or: npm i -g lefthook
#   lefthook install
#
# The split between pre-commit and pre-push is deliberate, and it is drawn by
# what each check costs rather than by how much it matters.
#
# pre-commit runs what is cheap enough to run dozens of times a day: the
# formatter and the analyzer over the staged files, and the architecture check
# over the workspace. The last of those is there because finding out at push
# time that a commit you already made breaks the constitution is a bad trade —
# the commit is written, the message is written, and the fix now needs an
# amend or a second commit. It is affordable because arch_check runs from a
# compiled snapshot; see the arch:check script in the root pubspec.
#
# pre-push runs what is not: the two staleness gates — generated code and the
# generated dependency graph — and the tests of everything the push can break.
# Running build_runner on every commit would tax every commit for a mistake
# that only becomes expensive once it reaches CI, and pre-push is the last
# point where catching it still costs nothing.
# ---------------------------------------------------------------------------

# Hooks would otherwise fire on every step of a rebase or on merge commits,
# where there is nothing meaningful for them to check.
skip:
  - merge
  - rebase

pre-commit:
  # Sequential, and named with numeric prefixes: lefthook orders commands by
  # name. The formatter rewrites the staged files and re-stages them, so the
  # two checks that read those files run after it rather than beside it.
  parallel: false
  commands:
    1_format:
      glob: "*.dart"
      # Formats the staged files and re-stages them, so a formatting-only
      # difference never becomes a second commit.
      run: dart format {staged_files} && git add {staged_files}

    2_analyze:
      glob: "*.dart"
      # tooling/arch_check's fixtures are deliberately broken mini workspaces
      # with no pub resolution, and `dart analyze <path>` ignores the root
      # analysis_options exclude when a file is named explicitly — which is
      # exactly what {staged_files} does. Excluding them here keeps the hook
      # agreeing with `melos run analyze`, which walks the workspace and does
      # honour the exclude.
      exclude:
        - "tooling/*/test/fixtures/**"
      # Scoped to staged files rather than the workspace: the analyzer still
      # resolves them in their full package context, but 74 packages do not get
      # walked for a two-file change.
      run: dart analyze --fatal-infos --fatal-warnings {staged_files}

    3_arch_check:
      # Not scoped to the staged files, and it cannot be: a cycle, a missing
      # barrel and a forbidden edge are properties of the workspace, not of a
      # file. It is affordable anyway — the arch:check script runs a compiled
      # snapshot, so this costs tenths of a second rather than the four
      # seconds `dart run` spends loading the tool.
      run: dart run melos run arch:check

pre-push:
  # Sequential, and named with numeric prefixes: lefthook orders commands by
  # name, so the generation gate runs before the architecture check, which runs
  # before the tests.
  parallel: false
  commands:
    1_gen_check:
      # The staleness gate. A generated file that no longer matches its source
      # breaks affected-test selection, so it must never reach the remote.
      run: dart run melos run gen:check

    2_arch_check:
      # Also on pre-commit, and kept here for the one path that skips it: the
      # `skip:` block above turns every hook off during a merge or a rebase,
      # so a merge commit combining two individually clean branches has never
      # been checked. This is the last local gate before CI sees it.
      run: dart run melos run arch:check

    3_graph_check:
      # The dependency graph is generated and committed, so it is a staleness
      # gate like the codegen one above — and it is also where a cycle is
      # caught. Cheap: it reads 75 pubspecs and writes nothing.
      run: dart run melos run graph:check

    4_test_affected:
      # Only the packages this push can break, walked outwards from the diff
      # against origin/main. The whole workspace would be minutes; this is
      # usually seconds, and it is the same selection CI makes.
      run: dart run melos run test:affected
