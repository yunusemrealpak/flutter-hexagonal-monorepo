# ---------------------------------------------------------------------------
# Workspace-wide analysis configuration.
#
# This file sits at the workspace root, so every package inherits it. A package
# only adds its own analysis_options.yaml when it has a genuine, documented
# reason to differ.
#
# Baseline: very_good_analysis 10.3.0 — 212 rules, strict-casts, strict-inference
# and strict-raw-types. A strict baseline is what makes `dart analyze
# --fatal-infos` meaningful as a gate: a lint that is merely a suggestion is a
# lint nobody fixes, and across 74 packages that debt compounds.
# ---------------------------------------------------------------------------
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # --- Constitution, enforced by the analyzer -----------------------------
    # Rule 1.2.5: a package's public surface is its barrel; `package:x/src/...`
    # is off limits. `implementation_imports` is the analyzer's own check for
    # exactly that, so it is promoted from lint to error and fails the IDE too,
    # not only the command line.
    implementation_imports: error

    # tooling/arch_check reads pubspec.yaml files and treats them as the truth
    # about what a package depends on. That premise only holds if an import
    # cannot exist without a matching pubspec entry, which is what this rule
    # guarantees. Promoted so a transitive import can never silently pass.
    depend_on_referenced_packages: error

    # --- Generated code ----------------------------------------------------
    # freezed and json_serializable place @Default / @JsonKey on constructor
    # parameters, which the analyzer reports as an invalid annotation target
    # even though the generators handle it correctly. This is the one
    # relaxation generated code genuinely requires.
    invalid_annotation_target: ignore

  # Deliberately NOT excluded: *.g.dart, *.freezed.dart, *.gr.dart and
  # *.config.dart. Generated code is committed and must keep being compiled and
  # type-checked; excluding it would hide real breakage — a generator output
  # that no longer matches its source is a build failure we want to see now,
  # not at app build time.
  #
  # Style lints are relaxed for those files by a different mechanism, one that
  # is per-file instead of per-project: the generators emit an
  # `// ignore_for_file: type=lint` header. For builders that do not emit one by
  # default, each package's build.yaml sets it explicitly:
  #
  #     targets:
  #       $default:
  #         builders:
  #           source_gen:combining_builder:
  #             options:
  #               ignore_for_file:
  #                 - type=lint
  #
  # That header suppresses lints only. Errors, warnings and type checks still
  # surface, which is exactly the balance this repository wants.
  exclude:
    - "**/*.mocks.dart"

linter:
  rules:
    # A port is a named interface with one method more often than not — Clock,
    # IdGenerator, RandomSource, CommandTransportPort. `one_member_abstracts`
    # would have every one of them replaced by a bare function type, which
    # deletes exactly what makes the architecture legible: the name of the
    # capability, the place its documentation lives, and the thing a fake and a
    # real adapter both declare they are. Section 3 of CLAUDE.md requires
    # `abstract interface class` for ports, so this rule is off workspace-wide
    # rather than suppressed at ~40 declaration sites.
    one_member_abstracts: false

    # Inside a package, import by relative path; across packages, import the
    # barrel. very_good_analysis picks the opposite of this pair, which makes
    # `package:core_kernel/src/value_object.dart` the correct form *inside*
    # core_kernel — and that is precisely what makes rule S3 unenforceable by
    # eye. S3 forbids reaching into another package's `src/`, but while a
    # package legitimately writes `package:<self>/src/...`, every occurrence
    # has to be checked against which package the file lives in before you can
    # tell a violation from a normal import.
    #
    # With relative imports inside a package, `package:*/src/` in the source
    # means one thing only: someone reached across a boundary. The rule becomes
    # a grep, and arch_check's deep-import check becomes exact rather than
    # context-sensitive.
    always_use_package_imports: false
    prefer_relative_imports: true

# No other rules are added on top of the baseline. very_good_analysis already carries
# the ones that do constitutional work here — implementation_imports,
# depend_on_referenced_packages, avoid_print (use the Logger port),
# only_throw_errors and avoid_catches_without_on_clauses (no exception crosses a
# port boundary), public_member_api_docs (an undocumented public member in an
# _api package is the wrong signal in a reference repository). Adding more would
# only make the set harder to reason about.
