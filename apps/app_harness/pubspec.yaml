name: app_harness
description: >-
  The composition root that stands every feature up on fakes. It is not a
  product shell: it exists so that the wiring itself has a place to be tested.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# An app may depend on anything — the one row in section 2 of
# docs/DEPENDENCY_RULES.md with no prohibitions. That is not a licence, it is
# the definition of a composition root: it is the only place allowed to know
# both halves of a hexagon at once, which is exactly why nothing else is.
#
# The _testing packages are dependencies rather than dev_dependencies here, and
# that is deliberate: this app's *product* behaviour is to run on fakes, so
# they ship in its lib/ and not only in its tests.
dependencies:
  core_kernel: ^0.1.0
  core_navigation: ^0.1.0
  core_ports: ^0.1.0
  core_testing: ^0.1.0
  delivery_api: ^0.1.0
  delivery_application: ^0.1.0
  delivery_presentation: ^0.1.0
  delivery_testing: ^0.1.0
  design_system: ^0.1.0
  design_tokens: ^0.1.0
  documents_api: ^0.1.0
  documents_core: ^0.1.0
  documents_presentation: ^0.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.0
  go_router: ^18.0.0
  http_dio: ^0.1.0
  identity_api: ^0.1.0
  identity_application: ^0.1.0
  identity_presentation: ^0.1.0
  identity_testing: ^0.1.0
  incidents_api: ^0.1.0
  incidents_core: ^0.1.0
  incidents_presentation: ^0.1.0
  injectable: ^3.0.0
  intl: ^0.20.2
  messaging_api: ^0.1.0
  messaging_core: ^0.1.0
  messaging_presentation: ^0.1.0
  messaging_testing: ^0.1.0
  notifications_api: ^0.1.0
  notifications_core: ^0.1.0
  notifications_presentation: ^0.1.0
  payments_api: ^0.1.0
  payments_application: ^0.1.0
  payments_presentation: ^0.1.0
  payments_testing: ^0.1.0
  push_messaging: ^0.1.0
  reporting_api: ^0.1.0
  reporting_core: ^0.1.0
  reporting_presentation: ^0.1.0
  routing_api: ^0.1.0
  routing_application: ^0.1.0
  routing_presentation: ^0.1.0
  routing_testing: ^0.1.0
  settings_api: ^0.1.0
  settings_core: ^0.1.0
  settings_presentation: ^0.1.0
  shipments_api: ^0.1.0
  shipments_application: ^0.1.0
  shipments_presentation_courier: ^0.1.0
  shipments_presentation_dispatcher: ^0.1.0
  shipments_testing: ^0.1.0
  sync_api: ^0.1.0
  sync_application: ^0.1.0
  sync_presentation: ^0.1.0
  sync_testing: ^0.1.0
  vehicle_inventory_api: ^0.1.0
  vehicle_inventory_core: ^0.1.0
  vehicle_inventory_presentation: ^0.1.0

dev_dependencies:
  build_runner: ^2.9.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3

# No `flutter: generate:` block, because this app runs no gen-l10n. It uses
# design_system's KeyEchoCatalogue as its real catalogue: a harness whose job
# is to prove every feature can be stood up wants to see *which* key each
# screen asked for, and a screen full of finished English would hide a label
# wired to the wrong key behind a sentence that reads fine.
#
# The component strings — "Try again", "Loading" — still come from
# design_system's own delegates, which is why flutter_localizations is here.
