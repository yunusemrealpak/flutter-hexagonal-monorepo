# Only injectable_generator, and only over lib/src/di/.
#
# §4.2 point 6 and rule G4: enable what the package needs and narrow it with
# generate_for. Scanning the router and the shell for annotations that are not
# there is work every build pays for.
targets:
  $default:
    builders:
      injectable_generator:injectable_builder:
        enabled: true
        generate_for:
          - lib/src/di/**.dart
      injectable_generator:injectable_config_builder:
        enabled: true
        generate_for:
          - lib/src/di/injection.dart
