# Mirrors the workspace template at the repository root. The test package reads
# the file next to the pubspec being tested, so every package carries its own
# copy; tooling/scaffold generates it per package type.
#
# shipments_api is pure Dart with no Flutter binding, so only the tags a pure
# Dart package can produce are declared here.
retry: 0
timeout: 30s

tags:
  unit:
  flaky:
    retry: 2
    timeout: 2x

presets:
  pr:
    exclude_tags: flaky
  quarantine:
    include_tags: flaky
