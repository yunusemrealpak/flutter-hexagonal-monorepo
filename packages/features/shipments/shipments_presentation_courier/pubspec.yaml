name: shipments_presentation_courier
description: >-
  The shipments UI as courier sees it.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a presentation package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  # The event transformers, and here one of them replaces code: `droppable()`
  # on the next page is the in-flight guard the controller used to write by
  # hand at its one call site.
  bloc_concurrency: ^0.3.0
  core_kernel: ^0.1.0
  core_navigation: ^0.1.0
  design_system: ^0.1.0
  flutter:
    sdk: flutter
  # Section 2 permits it: `feature_presentation` carries
  # `allow_third_party: true`.
  flutter_bloc: ^9.1.1
  # A foreign _api, which section 2 allows a presentation package. The screen
  # needs to know whose manifest to ask for, and it asks through SessionReader
  # — the narrowest port identity publishes for the purpose. It never learns
  # how identity decides, and it cannot sign anybody out.
  identity_api: ^0.1.0
  shipments_api: ^0.1.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  identity_testing: ^0.1.0
  shipments_testing: ^0.1.0
