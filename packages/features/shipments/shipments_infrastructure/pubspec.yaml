name: shipments_infrastructure
description: >-
  The shipments adapters: what answers its ports, the DTOs that cross the
  wire, and the mappers between them.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a infrastructure package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  # The technology contract this package answers its own ports over. Nothing
  # in shipments_api mentions HTTP, and nothing in shipments_application may
  # even see this package — section 2 forbids the edge — so the retry policy
  # that comes with speaking a protocol stays here, where it is a technology
  # decision rather than a business rule.
  http_dio: ^0.1.0
  json_annotation: ^4.12.0
  shipments_api: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.0
  core_testing: ^0.1.0
  json_serializable: ^6.14.0
  shipments_testing: ^0.1.0
  test: ^1.26.0
