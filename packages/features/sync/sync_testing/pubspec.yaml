name: sync_testing
description: >-
  Fakes, a builder and the contract kits for sync, consumed by other packages'
  tests and by two composition roots.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a testing package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
#
# No foreign _api, and none is possible: the fakes here queue TestSyncCommand,
# because reaching for a real command would mean importing a feature's
# _application package. That a queue's whole test suite never needs one is
# scenario 3 restated.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  core_testing: ^0.1.0
  sync_api: ^0.1.0
  # A runtime dependency here, and a dev dependency in core_testing. The
  # difference is what the two packages ship. core_testing ships fakes, which
  # are plain classes with no matchers in them; this package also ships
  # contract kits, and a contract kit *is* tests — it calls group() and test()
  # from lib/. Leaving `test` in dev_dependencies would make that a
  # dev_dependency_in_lib violation, and rightly so.
  test: ^1.26.0
