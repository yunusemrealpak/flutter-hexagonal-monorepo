# json_serializable only, and only from lib/src. The narrowing is rule G4.
#
# freezed and drift_dev are both absent rather than disabled. freezed is not a
# dev dependency here, so naming it would fail the build instead of tightening
# it. drift_dev is absent for a more interesting reason: this package declares
# no tables. The schema lives in platform/storage_drift, which owns one
# database per application rather than one per feature, so there is nothing
# here for a drift builder to generate.
targets:
  $default:
    builders:
      json_serializable:
        enabled: true
        generate_for:
          - lib/src/**.dart
        options:
          create_to_json: true
          field_rename: none
          # Without this, a nested DTO is written to the map as the object
          # itself and only becomes JSON when jsonEncode happens to walk it.
          # Anything that reads the map first fails with a cast error two
          # layers from the cause.
          explicit_to_json: true
      source_gen:combining_builder:
        options:
          ignore_for_file:
            - type=lint
