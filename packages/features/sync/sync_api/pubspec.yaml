name: sync_api
description: >-
  The sync contract: the SyncCommand interface every feature implements, the
  outbox domain, the ports and the sealed failures they return.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a api package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
#
# Worth reading for what is *not* here. Every other feature's _api in this
# workspace names at least one foreign _api; this one names none, and it never
# will. That absence is scenario 3: sync carries delivery's and payments' work
# without being able to write either name down, because all it ever sees is a
# routing key and an opaque payload.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.0
  test: ^1.26.0
