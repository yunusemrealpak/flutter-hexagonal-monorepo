name: reporting_api
description: >-
  The reporting contract: what a day of the operation adds up to, and the port
  that keeps the running total.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a api package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  # One foreign _api, for one identifier. A tally counts parcels by identifier
  # and never learns what is in one or where it went.
  shipments_api: ^0.1.0

dev_dependencies:
  test: ^1.26.0
