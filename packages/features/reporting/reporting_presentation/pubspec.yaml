name: reporting_presentation
description: >-
  The reporting UI: the board a dispatcher watches the day on.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a presentation package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  # `restartable()` on the range: a slow total for last week must not land on
  # top of a fresh one for today.
  bloc_concurrency: ^0.3.0
  core_kernel: ^0.1.0
  core_navigation: ^0.1.0
  design_system: ^0.1.0
  flutter:
    sdk: flutter
  # Section 2 permits a third party here — `feature_presentation` carries
  # `allow_third_party: true`. docs/ARCHITECTURE.md §2 carries the decision.
  flutter_bloc: ^9.1.1
  # For PermissionChecker. Scenario 6 for the fifth time, and the one feature
  # in phase 6 that is invisible to a courier entirely.
  identity_api: ^0.1.0
  reporting_api: ^0.1.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  # A dev dependency, and only that. Nothing under lib/ names a ShipmentId —
  # this board counts parcels and never identifies one — but a test has to
  # build a tally, and a tally is keyed by shipment. Section 2.0 puts a dev
  # dependency used only by test/ outside the dependency rules.
  shipments_api: ^0.1.0
