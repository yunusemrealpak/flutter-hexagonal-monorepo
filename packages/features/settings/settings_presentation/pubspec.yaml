name: settings_presentation
description: >-
  The settings UI: the screen where somebody chooses a language, a palette and
  what this device may spend their data on.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a presentation package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_navigation: ^0.1.0
  design_system: ^0.1.0
  flutter:
    sdk: flutter
  # For ActorId. The screen is always somebody's settings, and the identity is
  # handed to it by whichever app composed it.
  identity_api: ^0.1.0
  # The second foreign _api, and the operation behind the alerts switch. The
  # section is on this screen so it belongs to this package; turning alerts on
  # is notifications' operation so it arrives through its driving port. A
  # presentation package may not depend on another presentation package, so
  # drawing it from notifications_presentation was never an option.
  notifications_api: ^0.1.0
  settings_api: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
