name: identity_presentation
description: >-
  The identity UI.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a presentation package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  # The event transformer, and the only reason the events are worth having:
  # `droppable()` on a submitted credential is what stops a double tap on a
  # slow connection becoming two sign-ins with two device bindings.
  bloc_concurrency: ^0.3.0
  core_kernel: ^0.1.0
  core_navigation: ^0.1.0
  design_system: ^0.1.0
  flutter:
    sdk: flutter
  # Section 2 permits a third party here — `feature_presentation` carries
  # `allow_third_party: true` — and docs/ARCHITECTURE.md §2 carries what the
  # layer buys for it and what it costs.
  flutter_bloc: ^9.1.1
  identity_api: ^0.1.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  identity_testing: ^0.1.0
