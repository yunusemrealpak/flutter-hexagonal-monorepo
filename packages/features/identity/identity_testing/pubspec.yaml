name: identity_testing
description: >-
  Fakes and the contract kit for identity, consumed by other packages' tests.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a testing package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  core_testing: ^0.1.0
  identity_api: ^0.1.0
  # A runtime dependency, because this package ships a contract kit and a
  # contract kit *is* tests: it calls group() and test() from lib/. See the
  # note in shipments_testing's pubspec for why core_testing does the
  # opposite.
  test: ^1.26.0
