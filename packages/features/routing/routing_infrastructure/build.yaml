# json_serializable only, and only from lib/src. The narrowing is rule G4.
#
# freezed is absent rather than disabled: it is not a dev dependency of this
# package, so naming it would fail the build instead of tightening it. Nothing
# here needs it either — a DTO is a data class with a fromJson, and the domain
# types it maps to live in routing_api.
targets:
  $default:
    builders:
      json_serializable:
        enabled: true
        generate_for:
          - lib/src/**.dart
        options:
          create_to_json: true
          field_rename: none
          # Without this, a nested DTO is written to the map as the object
          # itself and only becomes JSON when jsonEncode happens to walk it.
          # Anything that reads the map first fails with a cast error two
          # layers from the cause.
          explicit_to_json: true
      source_gen:combining_builder:
        options:
          ignore_for_file:
            - type=lint
