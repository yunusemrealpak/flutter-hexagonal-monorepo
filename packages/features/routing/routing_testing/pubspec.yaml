name: routing_testing
description: >-
  Fakes, fixtures and the contract kits for routing — including the one three
  implementations of RouteOptimizerPort are held to.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a testing package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  core_testing: ^0.1.0
  # One foreign _api, which the feature_testing row allows, and for one type:
  # RouteFixtures.courier() returns an ActorId because that is what
  # RoutePlan.courier is. Section 2.1's rule holds here too — an identifier
  # crosses, a model does not — which is why shipments_api is not in this list
  # any more: a Stop is built from a label and two doubles now.
  identity_api: ^0.1.0
  routing_api: ^0.1.0
  # A runtime dependency, because a contract kit *is* tests: it calls group()
  # and test() from lib/. Leaving it in dev_dependencies would make that a
  # dev_dependency_in_lib violation, and rightly so.
  test: ^1.26.0
