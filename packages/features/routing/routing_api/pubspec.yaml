name: routing_api
description: >-
  The routing contract: a courier's route, the order it is driven in, and the
  ports two different optimisers answer.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a api package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  freezed_annotation: ^3.1.0
  # A foreign _api: a route is driven by an actor, and identity is where that
  # vocabulary lives.
  identity_api: ^0.1.0
  meta: ^1.19.0
  # A second foreign _api, and the more interesting one. A stop is usually a
  # place a parcel goes, so it names a ShipmentId and reuses shipments'
  # AddressPoint rather than inventing a parallel address type. Two features
  # with two spellings of "where a parcel is going" is a reconciliation that
  # ends up in whichever adapter noticed first.
  shipments_api: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.0
  test: ^1.26.0
