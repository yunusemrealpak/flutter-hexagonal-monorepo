name: routing_application
description: >-
  The routing use cases. Pure Dart, and blind to which optimiser is behind
  them.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a application package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  # A foreign _api, which section 2 allows. A route belongs to a courier, and
  # identity is where that vocabulary lives.
  identity_api: ^0.1.0
  routing_api: ^0.1.0

dev_dependencies:
  core_testing: ^0.1.0
  routing_testing: ^0.1.0
  test: ^1.26.0
