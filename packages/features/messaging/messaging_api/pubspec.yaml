name: messaging_api
description: >-
  The messaging contract: a thread between a courier and the operation, what
  counts as read, and the two ports that carry it.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a api package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  # Two foreign _api packages, for two identifiers. A thread may be about a
  # parcel; it never carries one.
  identity_api: ^0.1.0
  shipments_api: ^0.1.0

dev_dependencies:
  test: ^1.26.0
