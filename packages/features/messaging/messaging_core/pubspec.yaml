name: messaging_core
description: >-
  The messaging use cases, the thread store that doubles as the offline queue,
  and the transport that drains it.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a core package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  http_dio: ^0.1.0
  identity_api: ^0.1.0
  messaging_api: ^0.1.0
  shipments_api: ^0.1.0

dev_dependencies:
  core_testing: ^0.1.0
  # The contract kit, run here against the key-value adapter. This edge is the
  # reason messaging has a _testing package and the other six light features
  # do not — section 7 of CLAUDE.md.
  messaging_testing: ^0.1.0
  test: ^1.26.0
