name: payments_infrastructure
description: >-
  The payments adapters: the gateway, the device copy that makes it work in a
  tunnel, the day's store, the drawer, and the mappers between them.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a infrastructure package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
#
# No platform package brings the Flutter SDK in here, which is why this
# package's tests run under `dart test` while delivery_infrastructure's run
# under `flutter test`. Nothing about payments needs a device capability: money
# is an HTTP request and a row.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  http_dio: ^0.1.0
  json_annotation: ^4.12.0
  # No foreign feature appears in this list, which is section 2's row for
  # feature_infrastructure. The mapper still has to rebuild the ActorId and
  # ShipmentId that payments' contract is expressed in, and it does so through
  # CourierReference and ShipmentReference — readers published by payments_api,
  # the one layer allowed to see those packages.
  payments_api: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.0
  core_testing: ^0.1.0
  json_serializable: ^6.14.0
  payments_testing: ^0.1.0
  test: ^1.26.0
