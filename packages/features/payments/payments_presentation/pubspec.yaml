name: payments_presentation
description: >-
  The payments UI: the screen a courier takes money on.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a presentation package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_navigation: ^0.1.0
  design_system: ^0.1.0
  flutter:
    sdk: flutter
  # A foreign _api, which section 2 allows a presentation package. Scenario 6
  # again: the screen asks PermissionChecker before it offers the action that
  # takes money, and never learns how identity decides. SessionReader is the
  # other half — the screen needs to know who is collecting.
  identity_api: ^0.1.0
  payments_api: ^0.1.0
  # The other foreign _api, and for one type: which parcel the money is owed
  # against. An identifier crosses a feature boundary and a model does not.
  shipments_api: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  identity_testing: ^0.1.0
  payments_testing: ^0.1.0
