name: payments_api
description: >-
  The payments contract: money, what is owed on a parcel, the key that stops a
  retry becoming a second charge, and the ports that carry all three.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a api package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  freezed_annotation: ^3.1.0
  # Two foreign _api packages, and section 2.1 is why the list stops there.
  # What crosses is `ActorId` and `ShipmentId` — identifiers. What does not
  # cross is `Shipment` or `ShipmentSummary`: this package never learns what is
  # in a parcel or where it is going, only that money is owed against one.
  #
  # This edge is also one half of scenario 1. `payments_api` names
  # `shipments_api`, `shipments_application` will name `payments_api`, and the
  # graph stays acyclic because contract packages depend on no implementation.
  identity_api: ^0.1.0
  meta: ^1.19.0
  shipments_api: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.0
  test: ^1.26.0
