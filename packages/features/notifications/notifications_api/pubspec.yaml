name: notifications_api
description: >-
  The notifications contract: what lands in a courier's inbox, when it counts
  as read, and the two ports that carry it.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a api package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  # For ActorId. An inbox is always somebody's inbox, and the driving port is
  # where the identity belongs. The two driven ports below take a String.
  identity_api: ^0.1.0

dev_dependencies:
  test: ^1.26.0
