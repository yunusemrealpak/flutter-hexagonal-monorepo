name: incidents_presentation
description: >-
  The incidents UI: the board a dispatcher works down, and the form a courier
  reports from.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a presentation package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  # Three transformers for three meanings of "one at a time": restartable on
  # the read, droppable on a report, sequential on a resolve. The third is the
  # one that must not be droppable — every resolve is a different incident.
  bloc_concurrency: ^0.3.0
  core_kernel: ^0.1.0
  core_navigation: ^0.1.0
  design_system: ^0.1.0
  flutter:
    sdk: flutter
  # Section 2 permits a third party here — `feature_presentation` carries
  # `allow_third_party: true`. docs/ARCHITECTURE.md §2 carries the decision.
  flutter_bloc: ^9.1.1
  # For ActorId and PermissionChecker. Scenario 6 for the fourth time: this
  # package asks whether the signed-in actor may report, and learns nothing
  # about roles or grants.
  identity_api: ^0.1.0
  incidents_api: ^0.1.0
  shipments_api: ^0.1.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
