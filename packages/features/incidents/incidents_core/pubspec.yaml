name: incidents_core
description: >-
  The incidents use cases and the log that answers them, plus the watcher that
  opens an incident when a shipment reports that it failed.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a core package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  identity_api: ^0.1.0
  incidents_api: ^0.1.0
  # For ShipmentId and ShipmentFailed. The watcher subscribes to that event
  # through the DomainEventBus port; nothing here depends on
  # shipments_application, and shipments has never heard of incidents. That is
  # scenario 2, in a light feature and in one package.
  shipments_api: ^0.1.0

dev_dependencies:
  core_testing: ^0.1.0
  test: ^1.26.0
