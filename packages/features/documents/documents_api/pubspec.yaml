name: documents_api
description: >-
  The documents contract: the paperwork a round produces, where it is kept, and
  what it costs to produce it twice.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a api package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  # One foreign _api, for one identifier. Every document this feature produces
  # is about a parcel; none of them carries one.
  shipments_api: ^0.1.0

dev_dependencies:
  test: ^1.26.0
