name: documents_core
description: >-
  The documents use cases, the renderer that produces paperwork over HTTP, and
  the archive that keeps a device from filling with it.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a core package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  documents_api: ^0.1.0
  http_dio: ^0.1.0
  shipments_api: ^0.1.0

dev_dependencies:
  core_testing: ^0.1.0
  test: ^1.26.0
