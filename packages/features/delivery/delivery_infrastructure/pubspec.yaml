name: delivery_infrastructure
description: >-
  The delivery adapters: two answers to the proof store, the gateway, the
  geofence, and the mappers between them.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Exactly the dependency list section 2 of docs/DEPENDENCY_RULES.md allows for
# a infrastructure package. Adding one that is not in that row is a violation,
# not an exception — arch_check will say which rule and why.
dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  # No foreign feature appears in this list, which is section 2's row for
  # feature_infrastructure. The mapper still has to rebuild the ActorId and
  # ShipmentId that delivery's contract is expressed in, and it does so through
  # CourierReference and ShipmentReference — readers published by delivery_api,
  # the one layer allowed to see those packages.
  delivery_api: ^0.1.0
  # Declared even though it arrives transitively through the platform package
  # above, and the reason is the test runner. `melos run test` decides which
  # runner a package needs by looking for this entry, so without it the package
  # is handed to `dart test` — which cannot load `flutter_test` and fails at
  # import time. The SDK dependency is real either way; writing it down is what
  # makes it visible to a tool as well as to a reader.
  #
  # The feature_infrastructure row permits it: section 2's list is about
  # workspace packages, and the SDK is a separate axis — `allow_sdks: [flutter]`
  # in rules.yaml, whose question is whether this package binds a Flutter
  # engine. It does.
  flutter:
    sdk: flutter
  http_dio: ^0.1.0
  json_annotation: ^4.12.0
  # The platform package that turns a device into a position. It brings the
  # Flutter SDK with it, which is what binding a device capability costs: the
  # tests in this package run under the Flutter test runner. delivery_api and
  # delivery_application, where the rules live, stay pure Dart.
  location_service: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.0
  core_testing: ^0.1.0
  delivery_testing: ^0.1.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.0
