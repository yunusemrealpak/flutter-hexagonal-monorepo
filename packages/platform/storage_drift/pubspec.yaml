name: storage_drift
description: >-
  The SQLite schema every application ships with, its migrations, and the
  drift-backed adapter for the KeyValueStore port.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  drift: ^2.34.0
  # Imported only by the failure mapper, which reads sqlite's extended result
  # codes. It is already under drift, but an import needs its own pubspec entry
  # — `depend_on_referenced_packages` is an error in this workspace precisely
  # so that arch_check can trust a pubspec to describe what a package uses.
  sqlite3: ^3.5.0

dev_dependencies:
  build_runner: ^2.16.0
  # The adapter is stamped by an injected Clock, so its tests need FakeClock.
  # A dev dependency used only by test/ is outside the dependency table's scope
  # (docs/DEPENDENCY_RULES.md §2.0): nothing under lib/ imports it, so no edge
  # is created in the product graph.
  core_testing: ^0.1.0
  drift_dev: ^2.34.0
  test: ^1.26.0
