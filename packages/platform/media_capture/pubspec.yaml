name: media_capture
description: >-
  The photo-evidence contract, its image_picker-backed adapter, and the fake
  that lets a delivery flow be tested without a camera.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  flutter:
    sdk: flutter
  # The plugin, for the platform implementations it registers.
  image_picker: ^1.2.3
  # The adapter is written against the platform interface, so that a test can
  # substitute an implementation instead of a method channel.
  image_picker_platform_interface: ^2.11.1

dev_dependencies:
  core_testing: ^0.1.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
