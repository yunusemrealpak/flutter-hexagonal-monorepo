name: location_service
description: >-
  The location contract every feature that needs a position talks to, its
  geolocator-backed adapter, and the fake that keeps tests off the GPS.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  flutter:
    sdk: flutter
  # The plugin, for the platform implementations it registers.
  geolocator: ^14.0.3
  # The adapter is written against the platform interface, so that a test can
  # substitute an implementation instead of a method channel.
  geolocator_platform_interface: ^4.3.0

dev_dependencies:
  core_testing: ^0.1.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
