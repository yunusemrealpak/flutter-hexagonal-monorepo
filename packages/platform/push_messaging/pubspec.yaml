name: push_messaging
description: >-
  The push contract, its Firebase-backed adapter, and the DTO that turns a
  provider payload into something the product can act on.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  core_kernel: ^0.1.0
  core_ports: ^0.1.0
  # The plugin, for the platform implementations it registers.
  firebase_messaging: ^16.5.0
  # The adapter is written against the platform interface, so that a test can
  # substitute an implementation instead of a live Firebase app.
  firebase_messaging_platform_interface: ^4.9.3
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.0
  core_testing: ^0.1.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.0
  plugin_platform_interface: ^2.1.8
