# Configuration for `flutter gen-l10n`, one of the six generators in §4.1 of
# CLAUDE.md and the only one that does not run through build_runner.
#
# The output goes into lib/src/ and is committed like every other generated
# file (§4.3). It is deliberately not left in the synthetic package Flutter
# defaults to: a generated file that only exists inside .dart_tool cannot be
# reviewed in a pull request and cannot be seen by the affected-test selection
# that phase 8 derives from `git diff`.
arb-dir: l10n
template-arb-file: peyk_system_en.arb
output-dir: lib/src/l10n
output-localization-file: peyk_system_localizations.dart
output-class: PeykSystemLocalizations

# A missing translation is a bug, not a fallback. `false` makes the getter
# non-nullable so a screen never renders `null`, and the untranslated report
# below is what makes an unfinished language visible instead of silent.
nullable-getter: false
untranslated-messages-file: l10n/untranslated.json
