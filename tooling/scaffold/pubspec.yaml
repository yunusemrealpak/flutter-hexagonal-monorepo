name: scaffold
description: >-
  Generates a new feature's package skeleton: the directories, the pubspecs
  whose dependency lists match the constitution, the barrels, the seed sources,
  the tests, and the entry in the root workspace list.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# A tooling package may depend on third-party Dart packages and on nothing in
# packages/ or apps/ (docs/DEPENDENCY_RULES.md, rule I7). The scaffolder writes
# files and edits one YAML list; it never imports what it generates.
dependencies:
  args: ^2.7.0
  # The generated sources are formatted before they are written, not after.
  # `dart format`'s output depends on identifier length, so a template that
  # is correctly formatted for one feature name is wrong for a longer one —
  # and the failure surfaces as a red format:check in whoever's first commit,
  # not in the scaffolder's own tests.
  dart_style: ^3.1.12
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.26.0
