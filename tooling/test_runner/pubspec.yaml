name: test_runner
description: >-
  Decides which packages a change can break, runs their tests with the right
  runner, skips the ones whose sources have not moved since they last passed,
  and reports what it did.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

# A tooling package may depend on third-party Dart packages and on nothing in
# packages/, apps/ or tooling/ (docs/DEPENDENCY_RULES.md §2, `tooling.allow` is
# empty).
#
# It enumerates the workspace from the root pubspec's `workspace:` list rather
# than by walking directories, and that is not a shortcut: that list is what
# pub resolves against, so a package missing from it is a package no test run
# should pretend to cover.
dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.26.0
